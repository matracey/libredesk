name: Release

on:
  push:
    tags:
      - "v*.*.*-*"
  workflow_dispatch:

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*$ ]]; then
            echo "::error::Expected a tag such as v2.7.0-1"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: release-go-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ github.repository_owner }}

      - name: Verify package is publicly pullable
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          scope="repository:${IMAGE_OWNER}/libredesk:pull"
          # `--connect-timeout` bounds each connection attempt so a network stall fails
          # fast with our actionable message instead of hanging for the whole job timeout.
          # `--max-time` here is sized generously (not 15s) so it cannot cut the request's
          # own `--retry 3 --retry-delay 3` short: --max-time bounds the *entire*
          # invocation including all retries, so a too-small value would silently trigger
          # via `|| true` and get misreported as "package is private" instead of a
          # transient failure.
          # `|| true` on each substitution below is required: this step must run to
          # completion and print its own ::error:: diagnostic even when curl/grep/cut
          # fail or find nothing (e.g. the expected 403-denied response for a private
          # package), rather than being killed early by the shell's default `set -e`.
          token_response=$(curl -sSL --connect-timeout 5 --max-time 30 --retry 3 --retry-delay 3 "https://ghcr.io/token?scope=${scope}" || true)
          token=$(echo "$token_response" | grep -o '"token":"[^"]*"' | head -n1 | cut -d'"' -f4 || true)
          if [[ -z "$token" ]]; then
            echo "::error::ghcr.io/${IMAGE_OWNER}/libredesk is not anonymously pullable (or the request failed — see the auth response below). Set the libredesk package visibility to public in GitHub -> Packages -> Package settings, then re-run this job from the Actions tab."
            echo "Auth response: $token_response"
            exit 1
          fi

          # GHCR can take a few seconds to make a freshly pushed tag fetchable, so retry the
          # manifest check a few times before treating it as a real visibility failure.
          status=000
          for attempt in 1 2 3 4 5; do
            status=$(curl -sL --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${IMAGE_OWNER}/libredesk/manifests/${IMAGE_TAG}" || true)
            if [[ "$status" == "200" ]]; then
              break
            fi
            if [[ "$attempt" -lt 5 ]]; then
              sleep 5
            fi
          done
          if [[ "$status" != "200" ]]; then
            echo "::error::ghcr.io/${IMAGE_OWNER}/libredesk:${IMAGE_TAG} is not anonymously pullable (HTTP $status). Set the libredesk package visibility to public in GitHub -> Packages -> Package settings, then re-run this job from the Actions tab."
            exit 1
          fi

  rebase-upstream:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency:
      group: ${{ github.workflow }}-rebase-upstream-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/abhinavxd/libredesk.git
          git fetch --no-tags upstream '+refs/tags/v*:refs/tags/upstream/v*'

      - name: Rebase onto latest upstream release
        id: rebase
        run: |
          echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          latest_tag=$(git tag --list "upstream/v*" --sort=-version:refname | grep -E "^upstream/v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1 || true)
          base_tag=$(git tag --merged HEAD --list "upstream/v*" --sort=-version:refname | grep -E "^upstream/v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1 || true)
          if [[ -z "$latest_tag" || -z "$base_tag" ]]; then
            echo "::error::Could not resolve the current and latest upstream release tags"
            exit 1
          fi
          echo "latest_tag=${latest_tag#upstream/}" >> "$GITHUB_OUTPUT"
          if [[ "$latest_tag" == "$base_tag" ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rebase --onto "$latest_tag" "$base_tag" main; then
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Open conflict issue
        if: steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_TAG: ${{ steps.rebase.outputs.latest_tag }}
        run: |
          title="Upstream rebase conflict for main onto $LATEST_TAG"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq ".[0].number // empty")
          if [[ -z "$existing" ]]; then
            gh issue create \
              --title "$title" \
              --body "The manual rebase of \`main\` onto \`$LATEST_TAG\` conflicted. The workflow aborted the rebase and did not update the branch or publish an image."
          fi

      - name: Fail after rebase conflict
        if: steps.rebase.outputs.conflict == 'true'
        run: |
          echo "::error::Upstream rebase conflicted; see the open repository issue."
          exit 1

      - name: Update main
        if: steps.rebase.outputs.updated == 'true'
        env:
          ORIGINAL_SHA: ${{ steps.rebase.outputs.original_sha }}
        run: git push --force-with-lease="refs/heads/main:${ORIGINAL_SHA}" origin HEAD:refs/heads/main
