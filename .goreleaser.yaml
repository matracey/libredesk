version: 2

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

before:
  hooks:
    - go mod tidy
    - make frontend-build

builds:
  - id: "universal"
    main: ./cmd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - freebsd
      - linux
      - netbsd
      - openbsd
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    ignore:
      - goos: windows
        goarch: arm
    binary: libredesk
    ldflags:
      - -s -w -X "main.buildString={{ .Tag }} ({{ .ShortCommit }} {{ .Date }}, {{ .Os }}/{{ .Arch }})" -X "main.versionString={{ .Tag }}"
    hooks:
      post: make stuff BIN={{ .Path }}

archives:
  - formats: [tar.gz]
    name_template: 'libredesk_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if eq .Arch "arm" }}v{{ .Arm }}{{ end }}'
    files:
      - config.sample.toml
      - README.md
      - LICENSE

checksum:
  name_template: "libredesk_{{ .Version }}_checksums.txt"

source:
  enabled: true
  format: tar.gz
  name_template: "libredesk_{{ .Version }}_source"

dockers_v2:
  - &ghcr_image
    id: libredesk
    images:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}"
    tags:
      - "{{ .Tag }}"
    ids:
      - universal
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v6
      - linux/arm/v7
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - config.sample.toml
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "{{ .ProjectName }}"
      org.opencontainers.image.url: "https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}"
      org.opencontainers.image.source: "https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: '{{ time "2006-01-02T15:04:05Z07:00" }}'
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: AGPL-3.0
  - <<: *ghcr_image
    id: libredesk-amd64
    tags: ["{{ .Tag }}-amd64"]
    platforms: [linux/amd64]
  - <<: *ghcr_image
    id: libredesk-arm64
    tags: ["{{ .Tag }}-arm64"]
    platforms: [linux/arm64]
  - <<: *ghcr_image
    id: libredesk-armv6
    tags: ["{{ .Tag }}-armv6"]
    platforms: [linux/arm/v6]
  - <<: *ghcr_image
    id: libredesk-armv7
    tags: ["{{ .Tag }}-armv7"]
    platforms: [linux/arm/v7]

release:
  github:
    owner: "{{ .Env.GITHUB_ORG }}"
    name: libredesk
  prerelease: auto
  draft: true
